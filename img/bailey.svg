<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="bailey-title bailey-description">
  <title id="bailey-title">Bailey</title>
  <desc id="bailey-description">A simple golden-yellow ball wearing dark sunglasses and a charcoal bow tie.</desc>
  <!--
    Original vector artwork for Baileybot, 2026-11-14.
    Transparent background; no external assets, fonts, scripts or animation.
    Animation rig: bailey-float moves the whole character; sphere, sunglasses and bow tie can move independently. Nested groups keep
    position transforms separate from future animation transforms.
    Suggested pivots in viewBox coordinates: float (320,292), sphere (320,292),
    sunglasses (320,260), bow tie (320,430).
    Add animation in the host page, respecting prefers-reduced-motion.
  -->
  <defs>
    <radialGradient id="bailey-body-colour" cx="0" cy="0" r="1" gradientTransform="translate(247 177) rotate(60) scale(373 345)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE875"/>
      <stop offset=".42" stop-color="#FFD43B"/>
      <stop offset=".78" stop-color="#F8BD20"/>
      <stop offset="1" stop-color="#DEA01A"/>
    </radialGradient>
    <linearGradient id="bailey-frame-colour" x1="216" y1="225" x2="414" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303534"/>
      <stop offset="1" stop-color="#151D1C"/>
    </linearGradient>
    <linearGradient id="bailey-lens-colour" x1="230" y1="240" x2="280" y2="301" gradientUnits="userSpaceOnUse">
      <stop stop-color="#394C49"/>
      <stop offset=".58" stop-color="#1E302E"/>
      <stop offset="1" stop-color="#122321"/>
    </linearGradient>
    <linearGradient id="bailey-bow-colour" x1="254" y1="405" x2="385" y2="457" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343D39"/>
      <stop offset="1" stop-color="#17211E"/>
    </linearGradient>
    <filter id="bailey-soft-shadow" x="100" y="94" width="440" height="470" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#68471B" flood-opacity=".13"/>
    </filter>
    <filter id="bailey-accessory-shadow" x="-20%" y="-30%" width="140%" height="175%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#805316" flood-opacity=".2"/>
    </filter>
  </defs>

  <g id="bailey-float">
    <g id="bailey-sphere" filter="url(#bailey-soft-shadow)">
      <circle cx="320" cy="292" r="170" fill="url(#bailey-body-colour)"/>
      <path d="M190 216C211 174 246 150 285 144" stroke="#FFF3B0" stroke-width="12" stroke-linecap="round" opacity=".45"/>
      <path d="M207 403C236 433 277 449 318 450" stroke="#D49615" stroke-width="6" stroke-linecap="round" opacity=".18"/>
    </g>

    <g id="bailey-face">
      <g id="bailey-sunglasses" filter="url(#bailey-accessory-shadow)">
        <g id="bailey-glasses-arms" stroke="#222D29" stroke-width="10" stroke-linecap="round">
          <path d="M195 244L170 236"/>
          <path d="M445 244L470 236"/>
        </g>
        <g id="bailey-left-lens">
          <path d="M202 228C197 228 193 233 194 239L202 288C204 302 212 310 226 310H276C289 310 296 303 299 290L308 244C310 235 306 230 297 229C265 225 233 225 202 228Z" fill="url(#bailey-frame-colour)"/>
          <path d="M210 239L217 285C218 293 222 297 230 297H272C279 297 283 293 285 285L293 242C265 239 238 238 210 239Z" fill="url(#bailey-lens-colour)"/>
          <path d="M222 247L229 271M237 246L242 261" stroke="#7CADA0" stroke-width="5" stroke-linecap="round" opacity=".26"/>
        </g>
        <g id="bailey-right-lens" transform="translate(640 0) scale(-1 1)">
          <g id="bailey-right-lens-motion">
            <path d="M202 228C197 228 193 233 194 239L202 288C204 302 212 310 226 310H276C289 310 296 303 299 290L308 244C310 235 306 230 297 229C265 225 233 225 202 228Z" fill="url(#bailey-frame-colour)"/>
            <path d="M210 239L217 285C218 293 222 297 230 297H272C279 297 283 293 285 285L293 242C265 239 238 238 210 239Z" fill="url(#bailey-lens-colour)"/>
            <path d="M222 247L229 271M237 246L242 261" stroke="#7CADA0" stroke-width="5" stroke-linecap="round" opacity=".26"/>
          </g>
        </g>
        <path id="bailey-glasses-bridge" d="M302 250C313 244 327 244 338 250" stroke="#26322E" stroke-width="11" stroke-linecap="round"/>
        <circle cx="207" cy="237" r="3" fill="#819287"/>
        <circle cx="433" cy="237" r="3" fill="#819287"/>
      </g>

    </g>

    <g id="bailey-bow-tie" filter="url(#bailey-accessory-shadow)">
      <g id="bailey-bow-left">
        <path d="M309 423L265 403C253 397 246 402 247 414L249 450C250 460 257 463 266 458L310 439Z" fill="url(#bailey-bow-colour)"/>
        <path d="M261 414L296 429L263 446" stroke="#536058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
      </g>
      <g id="bailey-bow-right">
        <path d="M331 423L375 403C387 397 394 402 393 414L391 450C390 460 383 463 374 458L330 439Z" fill="url(#bailey-bow-colour)"/>
        <path d="M379 414L344 429L377 446" stroke="#536058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
      </g>
      <g id="bailey-bow-knot">
        <rect x="306" y="415" width="28" height="34" rx="9" fill="#242E28"/>
        <path d="M315 422V441" stroke="#65705A" stroke-width="3" stroke-linecap="round" opacity=".55"/>
        <circle cx="326" cy="432" r="2" fill="#EBC451"/>
      </g>
    </g>
  </g>
</svg>
